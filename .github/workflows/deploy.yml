# Deploy ttklia-web (doc 34, "Deploying a release"; doc 12). Skeleton only: every step is a TODO.
# A frontend-only release skips the worker step and the Docker part of the web hosts (doc 34).
# Staging: every merge to main. Production: a tagged release, after approval (GitHub environment `production`).
# AWS access is by OIDC (doc 16); no access keys, no SSH. Hosts run deploy-web.sh from ttklia-deploy via SSM.
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

